<!doctype html>
<meta charset="utf-8">
<title>دروع الرتب — مشهد ثلاثي الأبعاد يُخبَز إلى ملصق</title>
<style>body{margin:0;background:#111}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<canvas id="sheet"></canvas>
<script type="module">
/* عشر رتب × درع واحد يزداد بهاءً: معدن حقيقي، مينا لامعة، أحجار شفّافة، أجنحة وتاج وأكاليل.
   يُرسم كل درع بمحرّك WebGL ثم يُلصق في خلية ملصق واحد يُضمَّن في اللعبة —
   فالهاتف يعرض صورًا لا مشاهد، والجمال كلّه مدفوع مسبقًا. */
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
try{
const CELL=320, RENDER=800;
const TIERS=[
 {k:'bronze',      metal:0xc2732a, metalR:0.32, enamel:0x5a2f12, rivets:1, boss:1},
 {k:'silver',      metal:0xd6dce6, metalR:0.24, enamel:0x25344c, rivets:1, ring:1, star:0.7},
 {k:'gold',        metal:0xffc83a, metalR:0.22, enamel:0x6a4409, laurel:1, star:0.8},
 {k:'platinum',    metal:0xe6edf2, metalR:0.17, enamel:0x0f6a56, wings:1, laurel:1, star:0.8},
 {k:'diamond',     metal:0xdaeefa, metalR:0.15, enamel:0x0f4a80, wings:1, gem:0x5ac8f5, gemR:0.34},
 {k:'master',      metal:0xffc83a, metalR:0.22, enamel:0x6a2ac8, wings:2, gem:0xc07cff, gemR:0.3, star:1},
 {k:'grandmaster', metal:0xdae0ea, metalR:0.2,  enamel:0x44169a, wings:2, gem:0x9a4dff, gemR:0.3, star:1, laurel:1},
 {k:'champion',    metal:0xffc83a, metalR:0.22, enamel:0xc02424, wings:3, gem:0xff5a5a, gemR:0.32, star:1, laurel:1, sideGems:1},
 {k:'mythic',      metal:0xf0ab9c, metalR:0.2,  enamel:0xb0287e, wings:3, gem:0xff74b0, gemR:0.34, crown:1.0, sun:1, sideGems:1},
 {k:'legend',      metal:0xffd042, metalR:0.18, enamel:0xa87308, wings:4, gem:0xa8f0ff, gemR:0.38, crown:1.35, sun:1, laurel:1, sideGems:1}
];

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(RENDER,RENDER);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setClearColor(0x000000,0);
document.body.appendChild(renderer.domElement);
const pmrem=new THREE.PMREMGenerator(renderer);
/* استوديو: قبّة داكنة وثلاثة صناديق ضوء — انعكاسات المعدن تصير حادّة والمينا تحتفظ بلونها */
function studio(){
 const sc=new THREE.Scene();
 sc.add(new THREE.Mesh(new THREE.SphereGeometry(30,24,16),new THREE.MeshBasicMaterial({color:0x2c313c,side:THREE.BackSide})));   // قبّة رمادية: لا انعكاس أسود تمامًا
 const box=(w,h,col,pos,look)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide}));m.position.set(...pos);m.lookAt(...look);sc.add(m)};
 box(9,4,new THREE.Color(11,10.4,9.5),[-6,8,4],[0,0,0]);   // مفتاحي دافئ كبير أعلى اليسار
 box(6,3,new THREE.Color(7,7.2,8),[6,7,3],[0,0,0]);          // ثانٍ أعلى اليمين — الجناح الآخر يلمع أيضًا
 box(1.6,9,new THREE.Color(4,6,9),[8,3,-4],[0,0,0]);       // شريط بارد من الخلف يمينًا
 box(4,1.2,new THREE.Color(2.5,2.3,2),[2,-7,5],[0,0,0]);   // تعبئة خفيفة من الأسفل
 box(4,4,new THREE.Color(6.5,6.3,6),[-1,3,12],[0,0,0]);       // صندوق أمامي كبير: وجه المعدن يعكسه فيضيء
 box(5,1.6,new THREE.Color(3.2,2.7,2.1),[2,-4.5,10],[0,0,0]);  // بريق دافئ من أسفل الأمام — تدرّج على الوجه
 return sc;
}
const env=pmrem.fromScene(studio(),0.02).texture;

const scene=new THREE.Scene();scene.environment=env;
const camera=new THREE.PerspectiveCamera(28,1,0.1,100);
camera.position.set(0,0.2,8.4);camera.lookAt(0,0.05,0);
const key=new THREE.DirectionalLight(0xfff0d8,2.4);key.position.set(3,4.5,5);scene.add(key);
const rim=new THREE.DirectionalLight(0x9ed2ff,1.8);rim.position.set(-4,2.5,-3);scene.add(rim);
const fill=new THREE.DirectionalLight(0xffffff,0.22);fill.position.set(-3,0.5,4);scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff,0.12));

/* ── موادّ ── */
const metal=(hex,r)=>new THREE.MeshStandardMaterial({color:hex,metalness:1,roughness:r??0.26,envMapIntensity:1.45});
const enamel=hex=>new THREE.MeshPhysicalMaterial({color:hex,metalness:0.0,roughness:0.5,clearcoat:0.5,clearcoatRoughness:0.3,envMapIntensity:0.22});
const gemMat=hex=>new THREE.MeshPhysicalMaterial({color:hex,metalness:0,roughness:0.04,transmission:0.72,thickness:0.7,ior:2.3,clearcoat:1,
 emissive:new THREE.Color(hex).multiplyScalar(0.28),envMapIntensity:1.8});

/* ── أشكال ── */
function shieldShape(s){
 const sh=new THREE.Shape();
 sh.moveTo(-1*s,1.0*s);sh.quadraticCurveTo(0,1.17*s,1*s,1.0*s);
 sh.lineTo(1*s,0.05*s);sh.quadraticCurveTo(0.97*s,-0.98*s,0,-1.38*s);
 sh.quadraticCurveTo(-0.97*s,-0.98*s,-1*s,0.05*s);sh.closePath();return sh;
}
function starShape(R,r,n){const sh=new THREE.Shape();for(let i=0;i<n*2;i++){const a=Math.PI/2+i*Math.PI/n,rad=i%2?r:R;const x=Math.cos(a)*rad,y=Math.sin(a)*rad;i?sh.lineTo(x,y):sh.moveTo(x,y)}sh.closePath();return sh}
function featherShape(){const sh=new THREE.Shape();sh.moveTo(0,0);sh.bezierCurveTo(0.3,0.7,1.1,1.0,1.9,0.62);sh.bezierCurveTo(1.35,0.42,0.85,0.12,0.35,-0.22);sh.closePath();return sh}
function crownShape(){const sh=new THREE.Shape();const P=[[-0.6,0],[0.6,0],[0.6,0.2],[0.4,0.6],[0.24,0.24],[0,0.7],[-0.24,0.24],[-0.4,0.6],[-0.6,0.2]];P.forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));sh.closePath();return sh}

const extrude=(shape,depth,bevel,seg)=>new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel*0.9,bevelSegments:seg||5,curveSegments:28});

/* ── بناء درع رتبة ── */
function buildTier(t){
 const g=new THREE.Group();
 const M=metal(t.metal,t.metalR), E=enamel(t.enamel), G=t.gem?gemMat(t.gem):null;
 // الجسم المعدني
 const body=new THREE.Mesh(extrude(shieldShape(1),0.4,0.12,7),M);body.position.z=-0.2;g.add(body);
 // إطار معدني لامع حول اللوحة
 const frame=shieldShape(0.86);frame.holes.push(shieldShape(0.78));
 const fr=new THREE.Mesh(extrude(frame,0.06,0.02,3),M);fr.position.z=0.3;g.add(fr);
 // لوحة المينا
 const panel=new THREE.Mesh(extrude(shieldShape(0.78),0.05,0.03,4),E);panel.position.z=0.29;g.add(panel);
 // خط زخرفي داخلي للفضي
 if(t.ring){const r=shieldShape(0.66);r.holes.push(shieldShape(0.62));const m=new THREE.Mesh(extrude(r,0.02,0.01,2),M);m.position.z=0.36;g.add(m)}
 // مسامير
 if(t.rivets){[[0.86,0.86],[-0.86,0.86],[0.9,0.05],[-0.9,0.05]].forEach(([x,y])=>{const s=new THREE.Mesh(new THREE.SphereGeometry(0.075,20,16),M);s.position.set(x,y,0.33);g.add(s)})}
 // إكليل الغار
 if(t.laurel){
  const R=1.42, cy=-0.12, span=Math.PI*0.5;
  [-1,1].forEach(side=>{
   // اليمين من −100° إلى −10°، واليسار مرآته
   const start=side>0?-Math.PI*0.56:Math.PI+Math.PI*0.06;
   const arc=new THREE.Mesh(new THREE.TorusGeometry(R,0.05,10,40,span),M);
   arc.rotation.z=start;arc.position.set(0,cy,-0.05);g.add(arc);
   for(let i=0;i<10;i++){const a=start+span*(i+0.5)/10;
    const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.11,14,10),M);leaf.scale.set(1,0.48,0.4);
    leaf.position.set(Math.cos(a)*R,Math.sin(a)*R+cy,0.04);leaf.rotation.z=a+Math.PI/2+side*0.55;g.add(leaf)}
  });
 }
 // الأجنحة: عدد الريش يزداد بالرتبة
 if(t.wings){
  const W=metal(t.metal,Math.max(0.22,t.metalR));W.side=THREE.DoubleSide;
  [-1,1].forEach(side=>{
   for(let k=0;k<t.wings+1;k++){
    const f=new THREE.Mesh(extrude(featherShape(),0.08,0.025,3),W);
    const s=0.8+k*0.15;f.scale.set(s,s,1);
    f.rotation.z=0.72-k*0.34;
    f.position.set(side*(0.7+k*0.04),0.62-k*0.24,-0.34-k*0.04);
    if(side<0){f.scale.x=-s;f.rotation.z=-(0.72-k*0.34)}
    g.add(f);
   }
  });
 }
 // النجمة والحجر
 if(t.star){const st=t.star===1?1:t.star;const s=new THREE.Mesh(extrude(starShape(0.34*st,0.15*st,5),0.06,0.02,3),M);s.position.set(0,G?0.42:0.05,0.36);g.add(s)}
 if(t.boss){const b=new THREE.Mesh(new THREE.SphereGeometry(0.3,28,20),M);b.scale.z=0.55;b.position.set(0,0.05,0.34);g.add(b)}
 if(G){const gem=new THREE.Mesh(new THREE.OctahedronGeometry(t.gemR,0),G);gem.scale.set(1,1.35,0.72);gem.position.set(0,t.star?-0.25:0.02,0.42);gem.rotation.z=Math.PI/4*0;g.add(gem);
  const seat=new THREE.Mesh(new THREE.TorusGeometry(t.gemR*0.78,0.035,10,28),M);seat.position.copy(gem.position);seat.position.z-=0.02;g.add(seat)}
 if(t.sideGems&&G){[[-0.5,0.55],[0.5,0.55]].forEach(([x,y])=>{const s=new THREE.Mesh(new THREE.OctahedronGeometry(0.13,0),G);s.scale.set(1,1.3,0.7);s.position.set(x,y,0.4);g.add(s)})}
 // التاج
 if(t.crown){
  const cs=t.crown*1.25;
  const c=new THREE.Mesh(extrude(crownShape(),0.2,0.03,4),M);c.scale.set(cs,cs,1);c.position.set(0,1.1,-0.02);g.add(c);
  const tips=[[-0.4,0.6],[0,0.7],[0.4,0.6]];tips.forEach(([x,y])=>{const s=new THREE.Mesh(new THREE.SphereGeometry(0.085*cs,16,12),G||M);s.position.set(x*cs,1.1+y*cs,0.16);g.add(s)});
 }
 // شعاع خلفي
 if(t.sun){const S=metal(t.metal,0.4);S.emissive=new THREE.Color(t.metal).multiplyScalar(0.45);
  const sun=new THREE.Mesh(extrude(starShape(1.78,1.38,12),0.04,0.01,2),S);sun.position.set(0,-0.05,-0.62);sun.rotation.z=0.13;g.add(sun)}
 // ميل خفيف يُظهر السُّمك
 g.rotation.set(0.1,-0.3,0);
 // ملاءمة الخلية: أكبر بُعد = 3.5 وحدة
 const box=new THREE.Box3().setFromObject(g);const size=new THREE.Vector3();box.getSize(size);
 const s=3.5/Math.max(size.x,size.y);g.scale.setScalar(s);
 const box2=new THREE.Box3().setFromObject(g);const c=new THREE.Vector3();box2.getCenter(c);g.position.sub(c);
 return g;
}

const sheet=document.getElementById('sheet');sheet.width=CELL*TIERS.length;sheet.height=CELL;
const ctx=sheet.getContext('2d');ctx.imageSmoothingQuality='high';
const groups=[];
for(let i=0;i<TIERS.length;i++){
 const g=buildTier(TIERS[i]);groups.forEach(x=>scene.remove(x));groups.push(g);scene.add(g);
 renderer.render(scene,camera);renderer.render(scene,camera);   // مرّتان: هدف الشفافية يحتاج إطارًا سابقًا
 ctx.drawImage(renderer.domElement,0,0,RENDER,RENDER,i*CELL,0,CELL,CELL);
}
window.__OUT={webp:sheet.toDataURL('image/webp',0.9),png:sheet.toDataURL('image/png'),cells:TIERS.length,cell:CELL,keys:TIERS.map(t=>t.k)};
}catch(e){window.__ERR=String(e&&e.stack||e)}
</script>
