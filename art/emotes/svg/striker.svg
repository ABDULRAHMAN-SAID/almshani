<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill-rule="evenodd" stroke-linejoin="round" stroke-linecap="round">
 <defs>
  <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
   <stop offset="0" stop-color="#FFE9A8"/>
   <stop offset=".55" stop-color="#E8B23A"/>
   <stop offset="1" stop-color="#E8B23A" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <radialGradient id="gemG" cx="38%" cy="32%" r="70%">
   <stop offset="0" stop-color="#4C8BF0"/>
   <stop offset=".6" stop-color="#1E4EA6"/>
   <stop offset="1" stop-color="#123478"/>
  </radialGradient>
  <!-- top face of the striker (3/4 view); side band is the same ellipse 26px lower -->
  <ellipse id="faceE" cx="256" cy="286" rx="160" ry="135"/>
  <clipPath id="clipFaceE"><use href="#faceE"/></clipPath>
  <ellipse id="sideE" cx="256" cy="312" rx="160" ry="135"/>
  <clipPath id="clipSideE"><use href="#sideE"/></clipPath>
 </defs>

 <g id="glow">
  <ellipse cx="256" cy="290" rx="206" ry="200" fill="url(#glowG)" opacity=".18" filter="url(#soft)"/>
 </g>

 <!-- speed lines: the striker is flying to the right, the lines trail off to the left and pass behind the coin -->
 <g id="motion">
  <path d="M60 250H118" fill="none" stroke="#FFE9A8" stroke-width="9"/>
  <path d="M46 300H118" fill="none" stroke="#FFE9A8" stroke-width="9"/>
  <path d="M60 350H118" fill="none" stroke="#FFE9A8" stroke-width="9"/>
 </g>

 <g id="disc">
  <!-- side band (thickness) -->
  <use href="#sideE" fill="#B07E1E" stroke="#1A1230" stroke-width="8"/>
  <g clip-path="url(#clipSideE)">
   <ellipse cx="256" cy="312" rx="146" ry="121" fill="none" stroke="#8A6014" stroke-width="7" opacity=".6"/>
  </g>
  <!-- top face: base, shade crescent bottom-right, then rings -->
  <use href="#faceE" fill="#E8B23A"/>
  <g clip-path="url(#clipFaceE)">
   <ellipse cx="275" cy="308" rx="160" ry="135" fill="#B07E1E" opacity=".55"/>
   <ellipse cx="242" cy="270" rx="153" ry="128" fill="#E8B23A"/>
  </g>
  <use href="#faceE" fill="none" stroke="#1A1230" stroke-width="8"/>
  <ellipse cx="256" cy="286" rx="138" ry="116" fill="none" stroke="#FFE9A8" stroke-width="5"/>
  <ellipse cx="256" cy="286" rx="122" ry="101" fill="none" stroke="#B07E1E" stroke-width="7"/>
  <ellipse cx="256" cy="286" rx="122" ry="101" fill="none" stroke="#1A1230" stroke-width="2" opacity=".6"/>
  <ellipse cx="256" cy="286" rx="105" ry="86" fill="none" stroke="#FFE9A8" stroke-width="4"/>
  <!-- specular top-left -->
  <path d="M129 235A146 124 0 0 1 194 170" fill="none" stroke="#FFFFFF" stroke-width="9" opacity=".8"/>
 </g>

 <g id="gem">
  <ellipse cx="256" cy="285" rx="40" ry="34" fill="url(#gemG)" stroke="#1A1230" stroke-width="6"/>
  <ellipse cx="256" cy="285" rx="33" ry="27" fill="none" stroke="#0F2A66" stroke-width="5" opacity=".8"/>
  <path d="M231.7 269.3L256 257.9L280.3 269.3L256 307.9Z" fill="#3B76E0" opacity=".45"/>
  <ellipse cx="241.7" cy="270.7" rx="9.3" ry="5" fill="#FFFFFF" opacity=".95" transform="rotate(-32 241.7 270.7)"/>
  <circle cx="271.7" cy="299.3" r="3" fill="#FFFFFF" opacity=".8"/>
  <path d="M276 263.6A33 27 0 0 1 287.4 287.9" fill="none" stroke="#7FB0FF" stroke-width="4" opacity=".7"/>
 </g>

 <!-- the black carrom man being knocked away at top-right, with impact ticks at the contact point -->
 <g id="props">
  <circle cx="428" cy="150" r="30" fill="#1A1230" stroke="#4A403A" stroke-width="5"/>
  <path d="M410 136A24 24 0 0 1 428 126" fill="none" stroke="#6B5F58" stroke-width="4" opacity=".7"/>
  <circle cx="428" cy="150" r="7" fill="#E8B23A"/>
  <circle cx="425.5" cy="147.5" r="2.2" fill="#FFE9A8"/>
  <path d="M385 189L372.3 176.3" fill="none" stroke="#FFE9A8" stroke-width="6"/>
  <path d="M392 186V168" fill="none" stroke="#FFE9A8" stroke-width="6"/>
  <path d="M401 201L416.6 210" fill="none" stroke="#FFE9A8" stroke-width="6"/>
 </g>

 <g id="sparks">
  <path d="M104 132L107.8 146.2L122 150L107.8 153.8L104 168L100.2 153.8L86 150L100.2 146.2Z" fill="#FFFFFF" stroke="#1A1230" stroke-width="3"/>
  <path d="M336 95L338.8 105.2L349 108L338.8 110.8L336 121L333.2 110.8L323 108L333.2 105.2Z" fill="#FFFFFF" stroke="#1A1230" stroke-width="3"/>
  <path d="M72 401L74.3 409.7L83 412L74.3 414.3L72 423L69.7 414.3L61 412L69.7 409.7Z" fill="#FFFFFF" stroke="#1A1230" stroke-width="3"/>
  <path d="M440 357L443.2 368.8L455 372L443.2 375.2L440 387L436.8 375.2L425 372L436.8 368.8Z" fill="#FFFFFF" stroke="#1A1230" stroke-width="3"/>
  <path d="M150 442L152.1 449.9L160 452L152.1 454.1L150 462L147.9 454.1L140 452L147.9 449.9Z" fill="#FFFFFF" stroke="#1A1230" stroke-width="3"/>
  <circle cx="64" cy="206" r="5" fill="#FFE9A8" stroke="#1A1230" stroke-width="2.5"/>
  <circle cx="454" cy="250" r="5" fill="#FFE9A8" stroke="#1A1230" stroke-width="2.5"/>
  <circle cx="386" cy="88" r="4" fill="#FFE9A8" stroke="#1A1230" stroke-width="2.5"/>
  <circle cx="140" cy="100" r="4" fill="#FFE9A8" stroke="#1A1230" stroke-width="2.5"/>
 </g>
</svg>
