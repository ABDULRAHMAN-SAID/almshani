<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill-rule="evenodd" stroke-linejoin="round" stroke-linecap="round">
 <defs>
  <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
   <stop offset="0" stop-color="#FFE9A8"/>
   <stop offset=".55" stop-color="#E8B23A"/>
   <stop offset="1" stop-color="#E8B23A" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <radialGradient id="skinG" cx="42%" cy="34%" r="72%">
   <stop offset="0" stop-color="#EDBB93"/>
   <stop offset=".55" stop-color="#E3A97C"/>
   <stop offset="1" stop-color="#D89B6C"/>
  </radialGradient>
  <radialGradient id="blushG">
   <stop offset="0" stop-color="#E86A55" stop-opacity=".55"/>
   <stop offset="1" stop-color="#E86A55" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="clothG" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#FBF8F2"/>
   <stop offset="1" stop-color="#ECE6DA"/>
  </linearGradient>
  <pattern id="chk" width="22" height="22" patternUnits="userSpaceOnUse">
   <rect width="22" height="22" fill="#FBF8F2"/>
   <rect width="11" height="11" fill="#C8352E"/>
   <rect x="11" y="11" width="11" height="11" fill="#C8352E"/>
  </pattern>
  <!-- face silhouette (reused for fill, clip and outline) -->
  <path id="faceP" d="M256 94C322 94 354 144 354 208C354 268 318 310 256 310C194 310 158 268 158 208C158 144 190 94 256 94Z"/>
  <clipPath id="clipFace"><use href="#faceP"/></clipPath>
  <!-- ghutra back: behind the head, its bottom edge rides the shoulder line with a notch behind the neck -->
  <path id="ghbP" d="M256 64C340 64 406 112 406 184C406 250 408 314 410 378C380 366 350 350 324 344L290 338V280H222V338L188 344C162 350 132 366 102 378C104 314 106 250 106 184C106 112 172 64 256 64Z"/>
  <clipPath id="clipGhb"><use href="#ghbP"/></clipPath>
  <!-- ghutra front: crown + two drapes, one closed path (outer contour, then inner edge back up over the forehead) -->
  <path id="ghfP" d="M104 450C112 380 120 300 118 224C118 150 176 62 256 62C336 62 394 150 394 224C392 300 400 380 408 450C384 456 330 456 306 450C300 390 356 340 352 280C350 250 350 228 350 206C350 180 348 160 344 144C316 122 196 122 168 144C164 160 162 180 162 206C162 228 162 250 160 280C156 340 212 390 206 450C182 456 128 456 104 450Z"/>
  <clipPath id="clipGhf"><use href="#ghfP"/></clipPath>
  <path id="mouthP" d="M226 262Q256 294 286 262Q256 272 226 262Z"/>
  <clipPath id="clipMouth"><use href="#mouthP"/></clipPath>
 </defs>

 <g id="glow">
  <ellipse cx="256" cy="262" rx="200" ry="196" fill="url(#glowG)" opacity=".18" filter="url(#soft)"/>
 </g>

 <g id="body">
  <!-- neck (shade tone: it sits in the chin's shadow) -->
  <path d="M224 262H288V372H224Z" fill="#C9885B" stroke="#1A1230" stroke-width="8"/>
  <!-- dishdasha with round neckline -->
  <path d="M62 448C62 398 116 356 188 338L222 332C222 368 290 368 290 332L324 338C396 356 450 398 450 448C400 462 112 462 62 448Z" fill="url(#clothG)" stroke="#1A1230" stroke-width="8"/>
  <!-- placket + collar band + gold button -->
  <path d="M256 372V456" stroke="#DDD6C8" stroke-width="5"/>
  <path d="M218 330C218 376 294 376 294 330" fill="none" stroke="#1A1230" stroke-width="20"/>
  <path d="M218 330C218 376 294 376 294 330" fill="none" stroke="#FBF8F2" stroke-width="12"/>
  <circle cx="256" cy="384" r="7.5" fill="#E8B23A" stroke="#1A1230" stroke-width="4"/>
  <circle cx="253.5" cy="381.5" r="2.4" fill="#FFE9A8"/>
 </g>

 <g id="ghutra-back">
  <use href="#ghbP" fill="#E4DDD0" stroke="#1A1230" stroke-width="8"/>
  <!-- cast shadow of the jaw on the cloth behind -->
  <g clip-path="url(#clipGhb)">
   <ellipse cx="196" cy="318" rx="40" ry="20" fill="#D2CABA"/>
   <ellipse cx="316" cy="318" rx="40" ry="20" fill="#D2CABA"/>
  </g>
 </g>

 <g id="head">
  <!-- ears (tucked under the ghutra; only their outline bump shows) -->
  <ellipse cx="156" cy="226" rx="16" ry="22" fill="#E3A97C" stroke="#1A1230" stroke-width="7"/>
  <ellipse cx="356" cy="226" rx="16" ry="22" fill="#E3A97C" stroke="#1A1230" stroke-width="7"/>
  <!-- face: shade sliver bottom-right, then skin, then details, then outline -->
  <g clip-path="url(#clipFace)">
   <rect x="140" y="80" width="240" height="250" fill="#C9885B"/>
   <use href="#faceP" fill="url(#skinG)" transform="translate(-5 -12)"/>
   <!-- short beard / stubble along the jaw -->
   <path d="M158 196C158 264 196 318 256 318C316 318 354 264 354 196L354 224C354 266 312 292 256 292C200 292 158 266 158 224Z" fill="#3A2A22" opacity=".94"/>
   <path d="M196 284C214 296 234 302 256 302C278 302 298 296 316 284" fill="none" stroke="#5A463A" stroke-width="3" opacity=".7"/>
   <!-- cheeks -->
   <circle cx="198" cy="244" r="30" fill="url(#blushG)"/>
   <circle cx="314" cy="244" r="30" fill="url(#blushG)"/>
  </g>
  <use href="#faceP" fill="none" stroke="#1A1230" stroke-width="8"/>
  <!-- nose -->
  <ellipse cx="259" cy="248" rx="12" ry="8" fill="#C9885B" opacity=".55"/>
  <path d="M251 224C247 238 241 250 248 256C254 260 263 258 267 252" fill="none" stroke="#1A1230" stroke-width="4.5"/>
 </g>

 <g id="eyes">
  <ellipse cx="218" cy="202" rx="27" ry="31" fill="#FFFFFF" stroke="#1A1230" stroke-width="4.5"/>
  <ellipse cx="294" cy="202" rx="27" ry="31" fill="#FFFFFF" stroke="#1A1230" stroke-width="4.5"/>
  <circle cx="224" cy="206" r="18" fill="#4A2C12"/>
  <circle cx="296" cy="206" r="18" fill="#4A2C12"/>
  <circle cx="224" cy="206" r="9.5" fill="#0E0A08"/>
  <circle cx="296" cy="206" r="9.5" fill="#0E0A08"/>
  <circle cx="217" cy="197" r="6" fill="#FFFFFF"/>
  <circle cx="289" cy="197" r="6" fill="#FFFFFF"/>
  <circle cx="232" cy="214" r="2.8" fill="#FFFFFF"/>
  <circle cx="304" cy="214" r="2.8" fill="#FFFFFF"/>
  <path d="M193 196A27 31 0 0 1 243 196" fill="none" stroke="#1A1230" stroke-width="6.5"/>
  <path d="M269 196A27 31 0 0 1 319 196" fill="none" stroke="#1A1230" stroke-width="6.5"/>
 </g>

 <g id="brows">
  <path d="M182 172C190 150 224 142 246 154C251 157 251 165 246 170C226 160 204 164 190 182C184 185 180 178 182 172Z" fill="#15110F" stroke="#1A1230" stroke-width="3"/>
  <g transform="translate(0 -13) rotate(-12 298 166)"><path d="M330 172C322 150 288 142 266 154C261 157 261 165 266 170C286 160 308 164 322 182C328 185 332 178 330 172Z" fill="#15110F" stroke="#1A1230" stroke-width="3"/></g>
 </g>

 <g id="mouth">
  <path d="M222 270C236 288 268 292 292 266" fill="none" stroke="#1A1230" stroke-width="6"/>
  <path d="M292 266C297 262 300 268 297 273" fill="none" stroke="#1A1230" stroke-width="4"/>
 </g>

 <g id="ghutra-front">
  <use href="#ghfP" fill="#FBF8F2" stroke="#1A1230" stroke-width="8"/>
  <g clip-path="url(#clipGhf)">
   <!-- shadow along the inner (face-side) edge of each drape -->
   <path d="M162 206C162 228 162 250 160 280C156 340 212 390 206 450" fill="none" stroke="#E4DDD0" stroke-width="58"/>
   <path d="M350 206C350 228 350 250 352 280C356 340 300 390 306 450" fill="none" stroke="#E4DDD0" stroke-width="58"/>
   <!-- fold lines -->
   <path d="M148 220C144 300 164 380 156 446" fill="none" stroke="#DDD6C8" stroke-width="4"/>
   <path d="M364 220C368 300 348 380 356 446" fill="none" stroke="#DDD6C8" stroke-width="4"/>
   <!-- red-and-white checkered hem: 2 rows of squares along the hanging edge and the bottom -->
   <path d="M160 250C156 340 212 390 206 450L104 450" fill="none" stroke="url(#chk)" stroke-width="44"/>
   <path d="M352 250C356 340 300 390 306 450L408 450" fill="none" stroke="url(#chk)" stroke-width="44"/>
   <!-- shadow under the agal on the crown -->
   <path d="M132 124C190 144 322 144 380 124" fill="none" stroke="#DDD6C8" stroke-width="10"/>
  </g>
  <!-- crown highlight -->
  <path d="M206 80C222 70 250 66 276 68" fill="none" stroke="#FFFFFF" stroke-width="6" opacity=".9"/>
 </g>

 <g id="agal">
  <path d="M138 114C190 132 322 132 374 114" fill="none" stroke="#1A1230" stroke-width="21"/>
  <path d="M138 114C190 132 322 132 374 114" fill="none" stroke="#15110F" stroke-width="15"/>
  <path d="M144 111C190 127 322 127 368 111" fill="none" stroke="#4A403A" stroke-width="3"/>
  <path d="M142 95C190 113 322 113 370 95" fill="none" stroke="#1A1230" stroke-width="21"/>
  <path d="M142 95C190 113 322 113 370 95" fill="none" stroke="#15110F" stroke-width="15"/>
  <path d="M148 92C190 108 322 108 364 92" fill="none" stroke="#4A403A" stroke-width="3"/>
 </g>

 <g id="props">
  <!-- sleeve -->
  <path d="M354 386H452V450C428 460 380 462 362 452Z" fill="#FBF8F2" stroke="#1A1230" stroke-width="8"/>
  <path d="M362 408H444" fill="none" stroke="#DDD6C8" stroke-width="6"/>
  <path d="M366 440C392 448 424 446 442 440" fill="none" stroke="#DDD6C8" stroke-width="4"/>
  <!-- fist -->
  <path d="M366 300H408C432 300 446 308 446 322C446 330 440 334 432 334C442 334 448 340 448 350C448 358 442 362 432 362C442 362 448 368 448 378C448 388 440 392 430 392H372C360 392 354 384 354 372V318C354 308 358 300 366 300Z" fill="#E3A97C" stroke="#1A1230" stroke-width="8"/>
  <rect x="362" y="366" width="80" height="22" rx="10" fill="#C9885B"/>
  <path d="M432 334H414M432 362H412" fill="none" stroke="#1A1230" stroke-width="4.5"/>
  <ellipse cx="380" cy="322" rx="9" ry="5" fill="#F3C9A6" opacity=".85"/>
  <!-- thumb -->
  <path d="M356 314C346 292 352 246 372 230C388 216 412 226 412 248C412 268 404 290 402 314Z" fill="#E3A97C"/>
  <ellipse cx="400" cy="278" rx="6" ry="28" fill="#C9885B" transform="rotate(6 400 278)"/>
  <ellipse cx="380" cy="248" rx="7" ry="11" fill="#F3C9A6" opacity=".9" transform="rotate(-20 380 248)"/>
  <path d="M356 314C346 292 352 246 372 230C388 216 412 226 412 248C412 268 404 290 402 314" fill="none" stroke="#1A1230" stroke-width="8"/>
 </g>
</svg>
