  <g transform="translate(188 352) rotate(-14)">
   <rect x="-40" y="-14" width="80" height="30" rx="8" fill="#FBF8F2" stroke="#1A1230" stroke-width="8"/>
   <rect x="-36" y="3" width="72" height="9" fill="#DDD6C8"/>
  </g>
  <g transform="translate(324 352) rotate(14)">
   <rect x="-40" y="-14" width="80" height="30" rx="8" fill="#FBF8F2" stroke="#1A1230" stroke-width="8"/>
   <rect x="-36" y="3" width="72" height="9" fill="#DDD6C8"/>
  </g>
  <g transform="translate(174 296) rotate(-14)">
   <g fill="#1A1230" stroke="#1A1230" stroke-width="16"><rect x="-35" y="-8" width="70" height="56" rx="18"/><rect x="-35" y="-30" width="14" height="42" rx="7"/><rect x="-17" y="-44" width="15" height="56" rx="7.5"/><rect x="2" y="-48" width="15" height="60" rx="7.5"/><rect x="21" y="-40" width="14" height="52" rx="7"/></g>
   <g fill="#E3A97C"><rect x="-35" y="-8" width="70" height="56" rx="18"/><rect x="-35" y="-30" width="14" height="42" rx="7"/><rect x="-17" y="-44" width="15" height="56" rx="7.5"/><rect x="2" y="-48" width="15" height="60" rx="7.5"/><rect x="21" y="-40" width="14" height="52" rx="7"/></g>
   <clipPath id="clipHandSL"><rect x="-35" y="-8" width="70" height="56" rx="18"/><rect x="-35" y="-30" width="14" height="42" rx="7"/><rect x="-17" y="-44" width="15" height="56" rx="7.5"/><rect x="2" y="-48" width="15" height="60" rx="7.5"/><rect x="21" y="-40" width="14" height="52" rx="7"/></clipPath>
   <g clip-path="url(#clipHandSL)"><ellipse cx="26" cy="38" rx="48" ry="34" fill="#C9885B" opacity=".85"/></g>
   <ellipse cx="9.5" cy="-33" rx="4" ry="8" fill="#F3C9A6" opacity=".9"/>
   <path d="M-19 -8V6M-1 -8V8M19 -8V6" fill="none" stroke="#1A1230" stroke-width="4.5"/>
  </g>
  <g transform="translate(338 296) scale(-1 1) rotate(-14)">
   <g fill="#1A1230" stroke="#1A1230" stroke-width="16"><rect x="-35" y="-8" width="70" height="56" rx="18"/><rect x="-35" y="-30" width="14" height="42" rx="7"/><rect x="-17" y="-44" width="15" height="56" rx="7.5"/><rect x="2" y="-48" width="15" height="60" rx="7.5"/><rect x="21" y="-40" width="14" height="52" rx="7"/></g>
   <g fill="#E3A97C"><rect x="-35" y="-8" width="70" height="56" rx="18"/><rect x="-35" y="-30" width="14" height="42" rx="7"/><rect x="-17" y="-44" width="15" height="56" rx="7.5"/><rect x="2" y="-48" width="15" height="60" rx="7.5"/><rect x="21" y="-40" width="14" height="52" rx="7"/></g>
   <clipPath id="clipHandSR"><rect x="-35" y="-8" width="70" height="56" rx="18"/><rect x="-35" y="-30" width="14" height="42" rx="7"/><rect x="-17" y="-44" width="15" height="56" rx="7.5"/><rect x="2" y="-48" width="15" height="60" rx="7.5"/><rect x="21" y="-40" width="14" height="52" rx="7"/></clipPath>
   <g clip-path="url(#clipHandSR)"><ellipse cx="26" cy="38" rx="48" ry="34" fill="#C9885B" opacity=".85"/></g>
   <ellipse cx="9.5" cy="-33" rx="4" ry="8" fill="#F3C9A6" opacity=".9"/>
   <path d="M-19 -8V6M-1 -8V8M19 -8V6" fill="none" stroke="#1A1230" stroke-width="4.5"/>
