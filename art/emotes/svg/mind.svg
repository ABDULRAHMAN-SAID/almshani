 <g id="ghutra-front">
  <use href="#ghfP" fill="#FBF8F2" stroke="#1A1230" stroke-width="8"/>
  <g clip-path="url(#clipGhf)">
   <!-- shadow along the inner (face-side) edge of each drape -->
   <path d="M162 206C162 228 162 250 160 280C156 340 212 390 206 450" fill="none" stroke="#E4DDD0" stroke-width="58"/>
   <path d="M350 206C350 228 350 250 352 280C356 340 300 390 306 450" fill="none" stroke="#E4DDD0" stroke-width="58"/>
   <!-- fold lines -->
   <path d="M148 220C144 300 164 380 156 446" fill="none" stroke="#DDD6C8" stroke-width="4"/>
   <path d="M364 220C368 300 348 380 356 446" fill="none" stroke="#DDD6C8" stroke-width="4"/>
   <!-- red-and-white checkered hem: 2 rows of squares along the hanging edge and the bottom -->
   <path d="M160 250C156 340 212 390 206 450L104 450" fill="none" stroke="url(#chk)" stroke-width="44"/>
   <path d="M352 250C356 340 300 390 306 450L408 450" fill="none" stroke="url(#chk)" stroke-width="44"/>
   <!-- shadow under the agal on the crown -->
   <path d="M132 124C190 144 322 144 380 124" fill="none" stroke="#DDD6C8" stroke-width="10"/>
  </g>
  <!-- crown highlight -->
  <path d="M206 80C222 70 250 66 276 68" fill="none" stroke="#FFFFFF" stroke-width="6" opacity=".9"/>
 </g>

