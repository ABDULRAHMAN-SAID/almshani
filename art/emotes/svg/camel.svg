  </g>
  <!-- hair tuft on the apex -->
  <path d="M392 276C394 260 406 254 412 264C414 250 430 250 430 264C438 256 448 264 442 276Z" fill="#D9A86C" stroke="#1A1230" stroke-width="7"/>
 </g>
 <g id="neck">
