  <path id="lipP" d="M-34 28C-30 58 -54 88 -86 82C-112 78 -120 48 -110 16C-100 30 -84 40 -66 42C-52 44 -42 38 -34 28Z"/>
  <clipPath id="clipLip"><use href="#lipP"/></clipPath>
 </defs>
 <g id="glow">
  <ellipse cx="256" cy="262" rx="200" ry="196" fill="url(#glowG)" opacity=".18" filter="url(#soft)"/>
 </g>
 <g id="hump">
  <use href="#humpP" fill="#D9A86C" stroke="#1A1230" stroke-width="8"/>
  <g clip-path="url(#clipHump)">
   <path d="M404 276C438 304 444 400 436 470L480 470L480 270Z" fill="#B8874A" opacity=".9"/>
