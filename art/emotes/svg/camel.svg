  <g clip-path="url(#clipMouth)">
   <path d="M-112 2L-36 8L-38 28L-112 26Z" fill="#FFFFFF"/>
   <path d="M-94 2V28M-76 4V28M-58 6V28" fill="none" stroke="#1A1230" stroke-width="3"/>
   <path d="M-112 26L-38 28" fill="none" stroke="#1A1230" stroke-width="3"/>
   <ellipse cx="-72" cy="58" rx="26" ry="15" fill="#D9564F"/>
   <ellipse cx="-80" cy="50" rx="8" ry="3.5" fill="#F0837A" opacity=".8"/>
  </g>
  <use href="#mouthP" fill="none" stroke="#1A1230" stroke-width="5"/>
  <!-- split upper lip: far lobe then near lobe, each with a shade crescent + specular -->
  <ellipse cx="-70" cy="-6" rx="22" ry="14" fill="#B8874A"/>
  <ellipse cx="-73" cy="-10" rx="19" ry="10" fill="#D9A86C"/>
  <ellipse cx="-70" cy="-6" rx="22" ry="14" fill="none" stroke="#1A1230" stroke-width="5"/>
  <ellipse cx="-94" cy="-4" rx="22" ry="14" fill="#B8874A"/>
  <ellipse cx="-97" cy="-8" rx="19" ry="10" fill="#D9A86C"/>
  <ellipse cx="-94" cy="-4" rx="22" ry="14" fill="none" stroke="#1A1230" stroke-width="5"/>
  <ellipse cx="-102" cy="-10" rx="6" ry="3" fill="#F3D3A8" opacity=".9"/>
  <!-- nostril slit -->
  <path d="M-90 -26C-86 -36 -72 -36 -68 -28C-72 -22 -84 -20 -90 -26Z" fill="#5A3A22"/>
  <!-- eye: closed laughing arc + three lashes -->
  <path d="M0 -4Q20 14 40 -4" fill="none" stroke="#B8874A" stroke-width="4" opacity=".7"/>
  <path d="M-2 -14Q20 -40 42 -14" fill="none" stroke="#1A1230" stroke-width="6"/>
  <path d="M-2 -14L-13 -23M9 -24.5L1.5 -36.5M20 -28L20 -42" fill="none" stroke="#1A1230" stroke-width="5"/>
  <!-- bridle: noseband + cheek strap + rosette -->
  <path d="M-12 -54C-24 -14 -26 26 -10 62" fill="none" stroke="#1A1230" stroke-width="15"/>
  <path d="M-12 -54C-24 -14 -26 26 -10 62" fill="none" stroke="#E8B23A" stroke-width="8"/>
  <path d="M-18 10L86 -2" fill="none" stroke="#1A1230" stroke-width="13"/>
  <path d="M-18 10L86 -2" fill="none" stroke="#E8B23A" stroke-width="6"/>
  <path d="M-14 6L82 -5" fill="none" stroke="#FFE9A8" stroke-width="2" opacity=".8"/>
  <circle cx="-18" cy="10" r="9" fill="#FFE9A8" stroke="#1A1230" stroke-width="4"/>
  <!-- tassel under the jaw -->
  <g transform="translate(-10 62)">
   <path d="M0 0L-16 46M0 0L-2 52M0 0L14 48" fill="none" stroke="#1A1230" stroke-width="12"/>
   <path d="M0 0L-16 46M0 0L-2 52M0 0L14 48" fill="none" stroke="#E8B23A" stroke-width="6"/>
   <circle cx="0" cy="4" r="9" fill="#FFE9A8" stroke="#1A1230" stroke-width="4"/>
  </g>
