  <path id="headP" d="M-102 -2C-104 -24 -88 -40 -62 -44C-20 -54 30 -68 60 -60C82 -54 90 -30 88 4C86 40 60 60 20 60C-20 60 -70 50 -92 32C-100 26 -102 12 -102 -2Z"/>
