  <g clip-path="url(#clipNeck)">
   <path d="M332.4 462C331.6 457.5 329.1 444 327.8 435C326.5 426.1 325.6 417.8 324.4 408.2C323.2 398.7 322.1 388 320.7 377.6C319.4 367.2 317.9 356.1 316.1 345.7C314.3 335.4 312.6 326.2 310 315.6C307.3 305 304.2 293.3 300.3 282.1C296.3 270.8 291.5 258.9 286.3 248.1C281 237.2 275.9 227.7 268.8 216.9C261.7 206.1 247.9 188.8 243.7 183.2L266.4 164C271.1 170.1 286.2 188.4 294.3 200.7C302.5 213.1 309.4 225.6 315.5 238C321.7 250.4 326.6 262.9 331 275.2C335.3 287.4 338.6 299.1 341.7 311.4C344.7 323.7 347.3 337.3 349.4 349C351.6 360.8 352.9 371.2 354.4 381.7C355.9 392.2 357.1 402.3 358.5 412C359.9 421.6 361.3 431.1 362.8 439.4C364.3 447.8 366.8 458.2 367.6 462Z" fill="#B8874A" opacity=".9"/>
   <path d="M279.7 462C279.1 457.3 277.2 443.4 276.2 434C275.2 424.7 274.5 415.8 273.6 406.1C272.6 396.4 271.7 385.5 270.6 376C269.6 366.4 268.5 357.7 267.1 348.6C265.7 339.5 264.1 330.5 262 321.5C259.9 312.5 257.8 304 254.6 294.7C251.5 285.4 247.5 274.9 243.1 265.6C238.8 256.3 234.2 247.9 228.6 239C222.9 230 212.5 216.6 209.3 212.1" fill="none" stroke="#F0CC98" stroke-width="6" opacity=".6"/>
  </g>
 </g>
 <g id="head" transform="translate(188 190) rotate(-20)">
  <!-- ear: tall leaf at the poll (behind the skull) -->
  <path d="M60 -46C58 -70 74 -94 86 -90C98 -86 94 -60 80 -40Z" fill="#D9A86C" stroke="#1A1230" stroke-width="7"/>
  <path d="M68 -52C68 -68 78 -84 84 -82C90 -78 86 -62 78 -48Z" fill="#C97E6E"/>
  <!-- skull: base, shade lower/right, highlight along the nose bridge, outline -->
  <use href="#headP" fill="#D9A86C"/>
  <g clip-path="url(#clipHead)">
   <path d="M-104 22C-40 40 20 50 60 30C80 20 84 -20 66 -66L110 -70L110 90L-110 90Z" fill="#B8874A" opacity=".85"/>
   <path d="M-76 -36C-40 -48 10 -60 50 -58" fill="none" stroke="#F0CC98" stroke-width="9" opacity=".95"/>
  </g>
  <use href="#headP" fill="none" stroke="#1A1230" stroke-width="8"/>
  <!-- cheek blush -->
  <ellipse cx="-12" cy="10" rx="26" ry="15" fill="#E86A55" opacity=".3"/>
  <!-- heavy drooping lower lip -->
  <use href="#lipP" fill="#D9A86C" stroke="#1A1230" stroke-width="8"/>
  <g clip-path="url(#clipLip)">
   <path d="M-120 60C-100 78 -70 86 -30 70L-20 100L-130 100Z" fill="#B8874A" opacity=".9"/>
   <ellipse cx="-96" cy="52" rx="9" ry="5" fill="#F0CC98" opacity=".9"/>
  </g>
  <!-- big laughing mouth -->
