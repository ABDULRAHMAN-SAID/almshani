  <g clip-path="url(#clipEyeR)"><path d="M260 160H328V204Q294 200 260 196Z" fill="#DDA377"/></g>
  <circle cx="219" cy="203" r="4.8" fill="#FFFFFF"/>
  <circle cx="293" cy="203" r="4.8" fill="#FFFFFF"/>
  <ellipse cx="218" cy="202" rx="27" ry="31" fill="none" stroke="#1A1230" stroke-width="4.5"/>
  <ellipse cx="294" cy="202" rx="27" ry="31" fill="none" stroke="#1A1230" stroke-width="4.5"/>
  <path d="M191 203Q218 201 245 195" fill="none" stroke="#1A1230" stroke-width="6.5"/>
  <path d="M267 195Q294 201 321 203" fill="none" stroke="#1A1230" stroke-width="6.5"/>
 </g>

 <g id="brows">
  <path d="M180 156C186 130 226 122 248 136C253 140 253 148 248 152C228 142 204 146 190 166C185 170 178 162 180 156Z" fill="#A39D95" stroke="#1A1230" stroke-width="3.5"/>
  <path d="M332 176C326 160 292 152 268 164C263 167 263 175 268 180C288 172 308 174 322 190C328 193 334 184 332 176Z" fill="#A39D95" stroke="#1A1230" stroke-width="3.5"/>
 </g>

 <g id="mouth">
  <path d="M226 284Q262 302 298 276" fill="none" stroke="#1A1230" stroke-width="6"/>
  <path d="M298 276Q306 270 304 262" fill="none" stroke="#1A1230" stroke-width="4"/>
  <path id="mustP" d="M220 262C236 252 248 258 256 266C264 258 276 252 292 262C294 274 280 280 266 274C262 272 250 272 246 274C232 280 218 274 220 262Z"/>
