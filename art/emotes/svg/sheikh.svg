  <g clip-path="url(#clipBishtR)"><path d="M452 470L452 420C392 400 352 420 280 440L280 470Z" fill="#27212E"/></g>
  <!-- gold zari trim: outlines first, then gold, then light core, so the joins stay clean -->
  <path d="M84 388C122 362 160 348 222 337M428 388C390 362 352 348 290 337" fill="none" stroke="#1A1230" stroke-width="13"/>
  <path d="M222 336C224 378 226 418 230 458M290 336C288 378 286 418 282 458" fill="none" stroke="#1A1230" stroke-width="18"/>
  <path d="M84 388C122 362 160 348 222 337M428 388C390 362 352 348 290 337" fill="none" stroke="#E8B23A" stroke-width="7"/>
  <path d="M222 336C224 378 226 418 230 458M290 336C288 378 286 418 282 458" fill="none" stroke="#E8B23A" stroke-width="10"/>
  <path d="M90 385C126 360 162 348 220 338M422 385C386 360 350 348 292 338" fill="none" stroke="#FFE9A8" stroke-width="2" opacity=".9"/>
  <path d="M222 340C224 380 226 418 230 454M290 340C288 380 286 418 282 454" fill="none" stroke="#FFE9A8" stroke-width="3" opacity=".95"/>
 </g>

 <g id="ghutra-back">
  <use href="#ghbP" fill="#E4DDD0" stroke="#1A1230" stroke-width="8"/>
  <!-- cast shadow of the jaw on the cloth behind -->
  <g clip-path="url(#clipGhb)">
   <ellipse cx="196" cy="318" rx="40" ry="20" fill="#D2CABA"/>
   <ellipse cx="316" cy="318" rx="40" ry="20" fill="#D2CABA"/>
  </g>
 </g>

 <g id="head">
  <!-- ears (tucked under the ghutra; only their outline bump shows) -->
  <ellipse cx="156" cy="226" rx="16" ry="22" fill="#E3A97C" stroke="#1A1230" stroke-width="7"/>
  <ellipse cx="356" cy="226" rx="16" ry="22" fill="#E3A97C" stroke="#1A1230" stroke-width="7"/>
  <!-- face: shade sliver bottom-right, then skin, then details, then outline -->
  <g clip-path="url(#clipFace)">
   <rect x="140" y="80" width="240" height="250" fill="#C9885B"/>
   <use href="#faceP" fill="url(#skinG)" transform="translate(-5 -12)"/>
   <!-- cheeks -->
   <circle cx="198" cy="244" r="30" fill="url(#blushG)"/>
   <circle cx="314" cy="244" r="30" fill="url(#blushG)"/>
  </g>
  <use href="#faceP" fill="none" stroke="#1A1230" stroke-width="8"/>
  <!-- nose -->
  <ellipse cx="259" cy="248" rx="12" ry="8" fill="#C9885B" opacity=".55"/>
  <path d="M251 224C247 238 241 250 248 256C254 260 263 258 267 252" fill="none" stroke="#1A1230" stroke-width="4.5"/>
  <!-- age lines -->
  <path d="M188 188L175 181M187 212L174 217M324 188L337 181M325 212L338 217" fill="none" stroke="#1A1230" stroke-width="3" opacity=".55"/>
  <path d="M244 250C234 258 230 266 230 276M268 250C278 258 282 266 282 276" fill="none" stroke="#A86E45" stroke-width="3.5" opacity=".7"/>
  <!-- full grey beard -->
  <path id="beardP" d="M166 210C158 268 148 326 166 370C186 402 224 410 256 410C288 410 326 402 346 370C364 326 354 268 346 210C338 266 316 298 292 308L220 308C196 298 174 266 166 210Z"/>
  <clipPath id="clipBeard"><use href="#beardP"/></clipPath>
  <use href="#beardP" fill="#A39D95"/>
  <g clip-path="url(#clipBeard)">
   <path d="M300 300C330 330 330 380 300 420L380 420L380 240Z" fill="#767069" opacity=".85"/>
   <path d="M180 260C176 300 176 340 190 372" fill="none" stroke="#D3CEC7" stroke-width="8" opacity=".9"/>
   <path d="M212 326C214 352 222 378 236 396M256 322V402M300 326C298 352 290 378 276 396" fill="none" stroke="#5E5852" stroke-width="3.5" opacity=".6"/>
  </g>
  <use href="#beardP" fill="none" stroke="#1A1230" stroke-width="8"/>
 </g>

 <g id="eyes">
  <clipPath id="clipEyeL"><ellipse cx="218" cy="202" rx="27" ry="31"/></clipPath>
  <clipPath id="clipEyeR"><ellipse cx="294" cy="202" rx="27" ry="31"/></clipPath>
  <ellipse cx="218" cy="202" rx="27" ry="31" fill="#FFFFFF"/>
  <ellipse cx="294" cy="202" rx="27" ry="31" fill="#FFFFFF"/>
  <circle cx="226" cy="208" r="18" fill="#4A2C12"/>
  <circle cx="300" cy="208" r="18" fill="#4A2C12"/>
  <circle cx="226" cy="208" r="9.5" fill="#0E0A08"/>
  <circle cx="300" cy="208" r="9.5" fill="#0E0A08"/>
  <circle cx="233" cy="216" r="2.8" fill="#FFFFFF"/>
