   <path d="M232 92L256 60L268 82" fill="none" stroke="#FFE9A8" stroke-width="4" opacity=".9"/>
   <path d="M310 70C318 74 326 80 330 90M212 60C216 66 224 74 230 82" fill="none" stroke="#B07E1E" stroke-width="4" opacity=".7"/>
   <path d="M130 100C190 122 322 122 382 100L382 124C322 146 190 146 130 124Z" fill="#B07E1E" stroke="#1A1230" stroke-width="8"/>
   <path d="M138 106C190 126 322 126 374 106" fill="none" stroke="#E8B23A" stroke-width="5" opacity=".9"/>
   <circle cx="146" cy="58" r="7" fill="#C8352E" stroke="#1A1230" stroke-width="4.5"/>
   <circle cx="216" cy="50" r="7" fill="#C8352E" stroke="#1A1230" stroke-width="4.5"/>
   <circle cx="256" cy="48" r="8" fill="#C8352E" stroke="#1A1230" stroke-width="4.5"/>
   <circle cx="296" cy="50" r="7" fill="#C8352E" stroke="#1A1230" stroke-width="4.5"/>
   <circle cx="366" cy="58" r="7" fill="#C8352E" stroke="#1A1230" stroke-width="4.5"/>
   <ellipse cx="256" cy="124" rx="13" ry="9" fill="#2A63C9" stroke="#1A1230" stroke-width="4.5"/>
   <ellipse cx="252" cy="121" rx="4" ry="2.5" fill="#FFFFFF" opacity=".85"/>
   <circle cx="196" cy="118" r="5" fill="#C8352E" stroke="#1A1230" stroke-width="3"/>
   <circle cx="316" cy="118" r="5" fill="#C8352E" stroke="#1A1230" stroke-width="3"/>
  </g>
 </g>

 <g id="props">
  <!-- dishdasha cuff peeking at the wrist -->
  <g transform="translate(374 390) rotate(-20)">
   <rect x="-20" y="-14" width="40" height="28" rx="6" fill="#FBF8F2" stroke="#1A1230" stroke-width="7"/>
   <rect x="-16" y="3" width="32" height="7" fill="#DDD6C8"/>
  </g>
  <!-- misbaha: string + 11 gold beads on a U that hangs out of the fist -->
  <path d="M314 404C312 462 366 464 364 406" fill="none" stroke="#1A1230" stroke-width="3"/>
  <g fill="#E8B23A" stroke="#1A1230" stroke-width="3">
   <circle cx="314" cy="404" r="7"/>
   <circle cx="314.4" cy="415.4" r="7"/>
   <circle cx="316.5" cy="426.3" r="7"/>
   <circle cx="320.8" cy="436.3" r="7"/>
   <circle cx="328.2" cy="444.6" r="7"/>
   <circle cx="338.4" cy="448.5" r="7"/>
   <circle cx="349.1" cy="445.8" r="7"/>
   <circle cx="356.9" cy="438.1" r="7"/>
   <circle cx="361.6" cy="427.8" r="7"/>
   <circle cx="363.7" cy="416.9" r="7"/>
   <circle cx="364" cy="406" r="7"/>
  </g>
  <g fill="#FFE9A8" opacity=".9">
   <circle cx="318.5" cy="434" r="2"/><circle cx="336" cy="446" r="2"/><circle cx="354.5" cy="435.5" r="2"/><circle cx="359.5" cy="425.5" r="2"/>
  </g>
  <!-- small tassel under the bottom bead -->
  <path d="M334 455H343L345 465C340 468 337 468 332 465Z" fill="#B07E1E" stroke="#1A1230" stroke-width="3"/>
  <path d="M336.5 459V465M340.5 459V465" fill="none" stroke="#E8B23A" stroke-width="1.5" opacity=".9"/>
  <!-- right hand (fist) at chest level -->
  <g transform="translate(336 400) rotate(-20)">
   <clipPath id="clipHandSh"><rect x="-30" y="-22" width="60" height="44" rx="18"/></clipPath>
   <rect x="-30" y="-22" width="60" height="44" rx="18" fill="#E3A97C" stroke="#1A1230" stroke-width="8"/>
   <g clip-path="url(#clipHandSh)"><ellipse cx="-4" cy="22" rx="36" ry="16" fill="#C9885B" opacity=".85"/></g>
   <path d="M-30 -8H-6M-30 3H-4M-28 14H-6" fill="none" stroke="#1A1230" stroke-width="4"/>
   <ellipse cx="8" cy="-13" rx="7" ry="3.5" fill="#F3C9A6" opacity=".9"/>
  </g>
 </g>

</svg>
