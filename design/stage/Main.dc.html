<style>
*{margin:0;padding:0;box-sizing:border-box}
.ph{width:390px;height:844px;direction:rtl;overflow:hidden;position:relative;display:flex;flex-direction:column;padding:0 14px;
 background:
  radial-gradient(120% 46% at 50% 0%,#1A2244 0%,#0B1022 52%,#080B14 100%),
  #080B14;
 color:#F2F4F8;font-family:'Cairo','Noto Kufi Arabic','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.top{flex:0 0 54px;display:flex;align-items:center;gap:9px}
.ico{width:34px;height:34px;border-radius:11px;background:#141B2D;border:1px solid #28324E;display:grid;place-items:center;flex:0 0 auto}
.ttl{font-size:15px;font-weight:900}.tsub{font-size:9.5px;font-weight:700;color:#8390AD}
.code{margin-inline-start:auto;height:30px;padding:0 10px;border-radius:10px;background:#0E1424;border:1px solid #28324E;
 display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#C3CBDD;letter-spacing:1px}
/* بطاقة الدور — موزَّعة كورقة لعب */
.card{flex:0 0 158px;border-radius:20px;position:relative;overflow:hidden;padding:16px 18px;display:flex;align-items:center;gap:14px;
 background:linear-gradient(146deg,#241C4C 0%,#171232 46%,#2A2054 100%);
 border:1px solid #6C55B8;box-shadow:0 22px 44px -26px #000,inset 0 1px 0 rgba(255,255,255,.09)}
.card:before{content:"";position:absolute;inset:5px;border-radius:15px;border:1px solid rgba(232,178,58,.42);pointer-events:none}
.card:after{content:"";position:absolute;top:-60%;inset-inline-end:-20%;width:70%;height:220%;transform:rotate(18deg);
 background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.06),rgba(255,255,255,0));pointer-events:none}
.pip{position:absolute;color:#E8B23A;opacity:.55}
.pip.a{top:12px;inset-inline-start:14px}.pip.b{bottom:12px;inset-inline-end:14px;transform:rotate(180deg)}
.cEmb{width:76px;height:76px;border-radius:22px;flex:0 0 auto;display:grid;place-items:center;position:relative;
 background:radial-gradient(70% 70% at 34% 26%,#3A2D6E,#1B1440);border:1px solid #7B4FE0;
 box-shadow:0 12px 26px -14px rgba(123,79,224,.9),inset 0 1px 0 rgba(255,255,255,.14)}
.cLab{font-size:10.5px;font-weight:800;color:#A99AE0;letter-spacing:2.4px}
.cNm{font-size:30px;font-weight:900;line-height:1.1;margin-top:1px;
 background:linear-gradient(180deg,#FBE6A8,#D9A62D 62%,#A9761A);-webkit-background-clip:text;background-clip:text;color:transparent}
.cHt{font-size:11px;font-weight:700;color:#B5ACD8;margin-top:6px;line-height:1.5}
/* شريط الطور */
.ribbon{flex:0 0 46px;display:flex;align-items:center;gap:12px;margin-top:14px}
.hair{flex:1;height:1px;background:linear-gradient(90deg,transparent,#3A4570)}
.rlab{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;letter-spacing:.3px;white-space:nowrap}
.rtm{font-size:11px;font-weight:900;color:#E8B23A;font-variant-numeric:tabular-nums;
 background:rgba(232,178,58,.1);border:1px solid rgba(232,178,58,.32);border-radius:8px;padding:3px 8px}
/* الطاولة */
.tbl{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.tile{height:138px;border-radius:17px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding-top:16px;
 background:linear-gradient(180deg,#151D31,#0F1626);border:1px solid #212C49;box-shadow:0 12px 24px -20px #000}
.tile.tgt{border-color:#7B4FE0;background:linear-gradient(180deg,#1B1739,#101528);box-shadow:0 14px 30px -18px rgba(123,79,224,.9)}
.tile.me{grid-column:2;border-color:#B9891F;background:linear-gradient(180deg,#1E2137,#12172A)}
.tile.out{opacity:.42}
.av{width:60px;height:60px;border-radius:50%;overflow:hidden;background:#0B0F1C;border:1.5px solid #6E5218}
.tile.tgt .av{border-color:#B48BFF}.tile.me .av{border-color:#E8B23A}
.av svg{width:100%;height:100%;display:block}
.tile.out .av svg{filter:grayscale(1)}
.num{position:absolute;top:9px;inset-inline-start:9px;width:21px;height:21px;border-radius:50%;
 background:linear-gradient(180deg,#F6D98A,#AE7E19);color:#1A1204;font-size:10.5px;font-weight:900;display:grid;place-items:center;
 border:1.5px solid #0B0F1C;font-variant-numeric:tabular-nums}
.tnm{font-size:12.5px;font-weight:900;margin-top:9px;max-width:96%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.st{position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;align-items:center;justify-content:center;gap:5px;
 font-size:10px;font-weight:900;background:#0D1322;border-top:1px solid #1D2740;color:#7E8AA6}
.st:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.s-ok{color:#68D79C}.s-out{color:#E08D8C}.s-pur{color:#C3AAFF;background:#171139;border-top-color:#3B2C70}
.s-me{color:#F0C351;background:#191B2E;border-top-color:#3E3A22}
/* الشريط السفلي */
.bar{margin-top:auto;flex:0 0 88px;display:flex;align-items:center;gap:10px}
.btn{flex:1;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;
 background:linear-gradient(180deg,#F5D488,#CE9520);color:#1B1305;font-size:14.5px;font-weight:900;
 box-shadow:0 16px 28px -16px rgba(232,178,58,.85),inset 0 1px 0 rgba(255,255,255,.5)}
.sq{width:54px;height:54px;border-radius:16px;background:#141B2D;border:1px solid #28324E;display:grid;place-items:center;position:relative;flex:0 0 auto}
.dot{position:absolute;top:10px;inset-inline-end:10px;width:9px;height:9px;border-radius:50%;background:#E24B4A;border:2px solid #0C1120}
</style>
